# ---------------------------------------------------------------------------
# The snowflake driver fork (moved here with its consumer, 044).
# ---------------------------------------------------------------------------

[[allow]]
dependency = "snowflake-connector-rs"
manifest   = "Cargo.toml"
table      = "workspace.dependencies"
git        = "https://github.com/rapidbyte-io/snowflake-connector-rs.git"
rev        = "cd9ec04aa7ea65883f5b7bb2a5d6fb6dd0931be5"

reason = """
The published crate cannot upload a file to a stage: the SQL API refuses the
statement (structured code 391911) and the crate exposes no raw-response escape
hatch — verified in source during feature 022, which shipped two workarounds
because of it. This fork implements the upload, and feature 023 makes it the
connector's only ingestion path, deleting both workarounds. The capability
exists nowhere else on crates.io.
"""

exit = """
Either: the change is accepted upstream, and this becomes a registry version
(one line, `version = "1.2"`); or the fork is published under its own name and
consumed through cargo's `package =` rename, which needs ZERO source changes
because every `use snowflake_connector_rs::...` keeps resolving. The upstream
contribution opens once the fork has been validated in real use here — that
sequencing is deliberate and recorded in rdlt's specs history (023).
"""

unpublishable = [
    "rdlt-connector-duckdb",
    "rdlt-connector-file",
    "rdlt-connector-iceberg",
    "rdlt-connector-postgres",
    "rdlt-connector-rest",
    "rdlt-connector-snowflake",
    "rdlt-connector-sqlcore",
]
