# Git dependencies this workspace knowingly carries, and what each costs.
#
# An entry is not permission — it is a RECORD, and `unpublishable` is a claim
# tools/check-git-deps.sh verifies against the resolved dependency graph on
# every `make lint`. A dependency that spreads to another crate fails the check
# until the record is brought back into line.
#
# There is deliberately no entry shape for a dependency carrying both `git` and
# `version`: that form publishes successfully with the git source stripped, so
# it is refused outright rather than recorded.
#
# THE BLAST RADIUS IS THE WHOLE WORKSPACE, on every entry, by construction:
# every connector's one normal rdlt dependency (the sdk, or rdlt-connector for
# sqlcore) is a git dependency until the engine crates publish to the registry,
# so every publishable member reaches a git source and none can publish today.
# The check computes that set from the graph and each entry must record it.

# ---------------------------------------------------------------------------
# The engine-side crates, consumed from the rdlt repository by git while their
# registry publish wave (owner-scheduled, recorded in rdlt) has not run.
# ---------------------------------------------------------------------------

[[allow]]
dependency = "rdlt-connector"
manifest   = "Cargo.toml"
table      = "workspace.dependencies"
git        = "https://github.com/rapidbyte-io/rdlt"

reason = """
The connector SPI. Not yet published to the registry: the engine crates'
0.3.0 publish wave is separate, owner-scheduled work recorded in rdlt.
Until it runs, this repository consumes the SPI from rdlt's main by git —
version-less, so publishing refuses loudly rather than shipping a crate
that silently resolves a registry version that does not exist.
"""

exit = """
The rdlt workspace publishes its 0.3.0 wave; this entry then becomes a
registry version (one line, `version = "0.3.0"`) and the record is deleted.
"""

unpublishable = [
    "rdlt-connector-duckdb",
    "rdlt-connector-file",
    "rdlt-connector-iceberg",
    "rdlt-connector-postgres",
    "rdlt-connector-rest",
    "rdlt-connector-snowflake",
    "rdlt-connector-sqlcore",
]

